[package]
name = "hostd"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0"
camino = "1.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "signal", "fs", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
# Output digests in the audit log.
sha2 = "0.11"
# One wasmtime major across the portfolio: botwork's 49.x line, at the 49.0.4 advisory floor or later.
# Only the features hostd uses (botwork's set, plus `anyhow` for its error conversion and parallel
# compilation, which is host-side only): the defaults would also enable proposals and tooling the
# host never needs (component-model-async, stack switching, GC, threads, wat, the compile cache), each
# more surface for a guest to reach.
wasmtime = { version = "49.0.4", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "backtrace", "demangle", "anyhow", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.4", default-features = false, features = ["p2"] }
ureq = { version = "2.10.0", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
# Kill a timed-out process group (sandbox::run_bounded) without unsafe code.
rustix = { version = "1", features = ["process"] }
# Parse URLs for the browser host allowlist (sandbox::check_navigation).
url = "2"
thirtyfour = { version = "0.34", default-features = false, features = ["rustls-tls"] }
