# CI runs the local gate's recipes inside the flake's dev shell (`nix develop --command just ...`), so
# CI and `just ci` cannot drift. Every action is pinned to a full commit SHA with its release tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fmt, clippy, unit tests, docs, deny, WIT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run the gate
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just lint test doc deny wit

  e2e:
    name: e2e (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A step against a scripted LLM; browser sessions against a fake WebDriver; the probe guest
        # calling the WIT capabilities and WASI directly.
        test: [step_e2e, browser_e2e, probe_e2e]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build the component and run the test
        env:
          TEST: ${{ matrix.test }}
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just e2e "$TEST"

  flake:
    name: nix flake check, nix build .#hostd
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Check the flake
        run: nix flake check --extra-experimental-features 'nix-command flakes'
      - name: Build the host package
        run: nix build --extra-experimental-features 'nix-command flakes' .#hostd

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl --silent --show-error --location --fail --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
      - name: Check the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
